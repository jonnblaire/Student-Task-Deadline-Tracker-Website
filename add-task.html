      <a href="calendar.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</a>

    <div class="sidebar-footer">
      <div class="user-card"><div class="avatar">JD</div><div class="user-info"><div class="user-name">Juan Dela Cruz</div><div class="user-role">BS Information Technology</div></div></div>

  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-title">Add New Task</div>
      <div class="topbar-right">
        <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></button>
        <div class="avatar" style="width:36px;height:36px">JD</div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Add New Task</h1>
          <p class="page-subtitle">Create a new academic task and keep your deadlines organized.</p>
        </div>
      </div>

      <form class="card card-pad form-card" onsubmit="event.preventDefault()">
        <div class="form-grid">
          <div class="field full">
            <label for="title">Task Title <span class="req">*</span></label>
            <input id="title" type="text" placeholder="e.g. Research Paper on Web Security">
          </div>
          <div class="field full">
            <label for="desc">Description</label>
            <textarea id="desc" placeholder="Add notes, requirements, or reminders..."></textarea>
          </div>
          <div class="field">
            <label for="subject">Subject <span class="req">*</span></label>
            <select id="subject">
              <option value="">Select subject</option>
              <option>Web Development</option>
              <option>Database Management</option>
              <option>System Analysis and Design</option>
              <option>Computer Networks</option>
              <option>Information Assurance</option>
            </select>
          </div>
          <div class="field">
            <label for="type">Task Type <span class="req">*</span></label>
            <select id="type">
              <option value="">Select type</option>
              <option>Assignment</option>
              <option>Project</option>
              <option>Quiz</option>
              <option>Examination</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority <span class="req">*</span></label>
            <select id="priority">
              <option value="">Select priority</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>
          <div class="field">
            <label for="due">Due Date <span class="req">*</span></label>
            <input id="due" type="date">
          </div>
          <div class="field full">
            <label for="status">Status</label>
            <select id="status">
              <option>Pending</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <a href="my-tasks.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Task
          </button>
        </div>
      </form>
    </main>
  </div>
</div>
<div class="overlay"></div>
<script src="app.js"></script>
</body>
</html>
